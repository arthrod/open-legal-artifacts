<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immigration Papers Reader — open artifact</title>
<link rel="stylesheet" href="tokens.css">
<style>
  header { border-bottom: var(--hairline); padding: 28px var(--pad-x-mobile); }
  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--pad-x-mobile); }
  h1 { font-family: var(--font-mono); font-size: 20px; letter-spacing: 0.02em; margin-top: 8px; }
  .lede { color: var(--text-secondary); max-width: 640px; margin-top: 10px; }
  .rule { width: var(--rule-yellow-w); height: var(--rule-yellow-h); background: var(--accent); margin: 18px 0; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 32px 0 64px; }
  @media (max-width: var(--bp-mobile)) { main { grid-template-columns: 1fr; } }
  textarea { width: 100%; min-height: 440px; font-family: var(--font-mono); font-size: 12px; border: var(--hairline); background: #fff; padding: 12px; resize: vertical; }
  button { font-family: var(--font-mono); font-size: 13px; background: var(--accent); border: none; padding: 10px 18px; cursor: pointer; margin: 12px 0 24px; }
  button:hover { background: #e6bf00; }
  .err { color: #a00; font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; }
  .readiness { font-size: 28px; letter-spacing: -0.01em; }
  .score-bar { height: 10px; background: var(--border); margin: 8px 0 4px; }
  .score-bar > div { height: 100%; background: var(--accent); }
  .referral { border-left: 4px solid #a00; background: #fff; padding: 10px 12px; margin: 12px 0; font-size: 14px; }
  .sec { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 24px 0 6px; }
  ul { list-style: none; }
  ul li { border-top: var(--hairline); padding: 7px 0; font-size: 14px; }
  .st { font-family: var(--font-mono); font-size: 10px; padding: 2px 5px; margin-right: 8px; }
  .st.present { background: var(--accent); }
  .st.missing, .st.expired { background: #a00; color: #fff; }
  .st.expiring_soon { background: var(--border); }
  .muted { color: var(--text-secondary); font-size: 13px; }
  .warn { border-left: 4px solid #a00; padding: 4px 10px; margin: 6px 0; font-size: 13px; }
  .summary { background: #fff; border: var(--hairline); padding: 12px; font-size: 14px; }
</style>
</head>
<body>
<header><div class="wrap">
  <span class="t-eyebrow">Open legal artifacts · partner-built counterpart</span>
  <h1>immigration-papers-reader</h1>
  <div class="rule"></div>
  <p class="lede">Case facts in → required-documents checklist, per-document status with date math, readiness score, loud key dates, and a referral flag when complexity exceeds tool scope. Fictional case.</p>
</div></header>

<div class="wrap"><main>
  <section>
    <div class="sec">Case facts JSON (editable)</div>
    <textarea id="input" spellcheck="false"></textarea>
    <button id="run">Read case →</button>
    <div id="err" class="err"></div>
  </section>
  <section id="out" aria-live="polite"></section>
</main></div>

<script type="module">
import { readCase, exportChecklistMd } from '../core/core.js';

const SAMPLE = {
  case_type: "employment_based",
  today: "2026-11-07",
  applicant: { name: "M. Ferreira-Lindqvist (fictional)", petitioner_employer: "Solstice Robotics, Inc. (fictional)" },
  documents: {
    government_id: { present: true, expiry_date: "2028-03-14" },
    i140_notice: { present: true },
    employment_letter: { present: true },
    pay_stubs: { present: true },
    i693_medical: { present: true, expiry_date: "2027-01-30" },
    tax_returns: { present: false }
  },
  key_dates: { "I-485 interview (fictional)": "2026-11-18", "EAD renewal deadline (fictional)": "2026-12-01" },
  complexity: ["prior_denial"]
};

const $ = (id) => document.getElementById(id);
$('input').value = JSON.stringify(SAMPLE, null, 2);
function esc(s) { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

function render(r) {
  let h = `<div class="sec">${esc(r.case_label)}</div>
    <p class="readiness">${r.readiness.score}% <span class="muted">ready (${r.readiness.ready_count}/${r.readiness.required_count} required valid) · as of ${esc(r.today)}</span></p>
    <div class="score-bar"><div style="width:${r.readiness.score}%"></div></div>`;
  if (r.referral.flag) {
    h += `<div class="referral"><strong>REFERRAL RECOMMENDED</strong><ul style="margin-top:6px">` +
      r.referral.reasons.map((x) => `<li style="border:none;padding:2px 0">— ${esc(x.label)}</li>`).join('') + `</ul></div>`;
  }
  h += `<div class="sec">Required documents</div><ul>`;
  for (const c of r.checklist.filter((x) => x.required)) h += `<li><span class="st ${c.status}">${c.status}</span><strong>${esc(c.label)}</strong><br><span class="muted">${esc(c.detail)}</span></li>`;
  h += `</ul>`;
  if (r.key_dates.length) {
    h += `<div class="sec">Key dates</div><ul>`;
    for (const k of r.key_dates) h += `<li><strong>${esc(k.label)}: ${esc(k.date)}</strong> <span class="muted">— ${k.days_until >= 0 ? `${k.days_until} day(s) away${k.urgent ? ' · URGENT' : ''}` : `${-k.days_until} day(s) ago`}</span></li>`;
    h += `</ul>`;
  }
  if (r.warnings.length) { h += `<div class="sec">Warnings</div>`; for (const w of r.warnings) h += `<div class="warn">⚠ ${esc(w)}</div>`; }
  h += `<div class="sec">Plain-language summary</div><div class="summary">${r.summary.map((s) => `<p>${esc(s)}</p>`).join('')}</div>
    <div class="sec">Checklist export</div><textarea readonly style="min-height:160px">${esc(exportChecklistMd(r))}</textarea>`;
  $('out').innerHTML = h;
}
$('run').addEventListener('click', () => {
  $('err').textContent = '';
  try { render(readCase(JSON.parse($('input').value))); } catch (e) { $('err').textContent = String(e.message ?? e); }
});
render(readCase(SAMPLE));
</script>
</body>
</html>
