<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Obligations checker — open artifact</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 64px var(--pad-x-mobile) 96px; }
  h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px; }
  .rule { width: var(--rule-yellow-w); height: var(--rule-yellow-h); background: var(--accent); margin: 0 0 20px; }
  .lede { color: var(--text-secondary); max-width: 64ch; line-height: 1.6; margin: 0 0 8px; }
  h2 { font-family: var(--font-mono); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; margin: 40px 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--border); border: var(--hairline); margin-bottom: 24px; }
  .card { background: #fff; padding: 16px; }
  .card .k { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); }
  .card .v { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
  .card.alert .v { background: linear-gradient(transparent 60%, var(--accent) 60%); display: inline; }
  textarea { width: 100%; box-sizing: border-box; min-height: 280px; font-family: var(--font-mono); font-size: 12px; border: var(--hairline); background: #fff; padding: 12px; }
  button { font-family: var(--font-mono); font-size: 13px; border: 1px solid var(--text); background: var(--text); color: var(--bg); padding: 10px 18px; cursor: pointer; margin-top: 12px; }
  button:hover { background: var(--accent); border-color: var(--accent); color: var(--text); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; text-align: left; border-bottom: 2px solid var(--text); padding: 8px 10px; }
  td { border-bottom: var(--hairline); padding: 8px 10px; vertical-align: top; }
  tr:hover td { background: var(--hover); }
  .chip { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--text); padding: 1px 7px; display: inline-block; white-space: nowrap; }
  .chip.overdue { background: var(--flag-tint); color: var(--bad); border-color: var(--bad);}
  .chip.unscheduled, .chip.conditional { border-style: dashed; color: var(--text-secondary); border-color: var(--text-secondary); }
  .clause { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
  .notes { color: var(--text-secondary); font-size: 12px; }
  .err { border: 2px solid var(--text); background: var(--flag-tint); font-family: var(--font-mono); padding: 12px; margin-top: 12px; display: none; color: var(--bad); border-color: var(--bad);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Obligations checker</h1>
  <div class="rule"></div>
  <p class="lede">Contract obligations in, compliance register out: per-obligation status tracking against satisfaction records, with breach-risk flags the moment a due date passes unmet. Deterministic — same inputs, same register, every time.</p>

  <h2>Register input (JSON)</h2>
  <textarea id="input" spellcheck="false"></textarea>
  <button id="run">Build register</button>
  <div class="err" id="err"></div>

  <h2>Summary</h2>
  <div id="summary"></div>
  <h2>Register</h2>
  <div id="board"></div>
</div>

<script type="module">
import { buildRegister, toCSV } from '../core/core.js';

const DEFAULT_INPUT = {
  asOf: new Date().toISOString().slice(0, 10),
  settings: { dueSoonDays: 14 },
  obligations: [
    { id: 'OBL-1', clause: '§ 4.1', party: 'Customer', verb: 'pay', text: 'pay the Phase 2 milestone fee of $48,000', dueDate: '2026-10-30', amount: 48000 },
    { id: 'OBL-2', clause: '§ 5.2', party: 'Supplier', verb: 'deliver', text: 'deliver the platform security audit report', dueDate: '2026-11-12' },
    { id: 'OBL-3', clause: '§ 5.4', party: 'Supplier', verb: 'notify', text: 'notify Customer of any security incident within 72 hours of discovery', dueDate: null, condition: 'within 72 hours of discovery of a security incident' },
    { id: 'OBL-6', clause: '§ 8.2', party: 'Supplier', verb: 'deliver', text: 'deliver the Q3 API usage statement', dueDate: '2026-09-30' },
  ],
  satisfaction: [
    { obligationId: 'OBL-6', satisfiedOn: '2026-10-03', evidence: 'email thread 2026-10-03 (fictional)' },
  ],
};

const $ = (id) => document.getElementById(id);
$('input').value = JSON.stringify(DEFAULT_INPUT, null, 2);
function esc(s) { return String(s).replace(/</g, '&lt;'); }

$('run').addEventListener('click', () => {
  const errEl = $('err'); errEl.style.display = 'none';
  let reg;
  try { reg = buildRegister(JSON.parse($('input').value)); }
  catch (e) { errEl.textContent = 'Input error: ' + e.message; errEl.style.display = 'block'; return; }
  const s = reg.summary;
  $('summary').innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">Obligations</div><div class="v">${s.total}</div></div>
      <div class="card alert"><div class="k">Breach risk</div><div class="v">${s.breachRisk}</div></div>
      <div class="card"><div class="k">Open</div><div class="v">${s.open}</div></div>
      <div class="card"><div class="k">Satisfied</div><div class="v">${s.satisfied}${s.satisfiedLate ? ` (${s.satisfiedLate} late)` : ''}</div></div>
      <div class="card"><div class="k">Unsched./cond.</div><div class="v">${s.unscheduledOrConditional}</div></div>
    </div>`;
  const order = { overdue: 0, 'due-soon': 1, unscheduled: 2, conditional: 3, pending: 4, satisfied: 5 };
  const rows = [...reg.obligations].sort((a, b) => order[a.status] - order[b.status] || a.id.localeCompare(b.id))
    .map((o) => `
    <tr>
      <td><strong>${esc(o.id)}</strong> <span class="clause">${esc(o.clause ?? '')}</span><br /><span class="notes">${esc(o.party)} · ${esc(o.verb)}${o.amount != null ? ' · $' + o.amount.toLocaleString('en-US') : ''}</span></td>
      <td>${esc(o.text)}</td>
      <td>${o.dueDate ?? '—'}${o.condition ? `<br /><span class="notes">if: ${esc(o.condition)}</span>` : ''}</td>
      <td><span class="chip ${o.status}">${o.status}</span>${o.breachRisk ? ' <span class="chip overdue">breach risk</span>' : ''}</td>
      <td>${o.satisfaction ? `${o.satisfaction.satisfiedOn}<br /><span class="notes">${esc(o.satisfaction.evidence ?? '')}</span>` : '—'}</td>
      <td>${o.flags.length ? `<span class="notes">${o.flags.map(esc).join('<br>')}</span>` : '—'}</td>
    </tr>`).join('');
  $('board').innerHTML = `<table><thead><tr><th>Id</th><th>Obligation</th><th>Due</th><th>Status</th><th>Satisfaction</th><th>Flags</th></tr></thead><tbody>${rows}</tbody></table>`;
  window.__csv = toCSV(reg);
});
$('run').click();
</script>
</body>
</html>
