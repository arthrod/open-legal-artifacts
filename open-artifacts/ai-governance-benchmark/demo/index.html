<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Governance Benchmark — open artifact</title>
<link rel="stylesheet" href="tokens.css">
<style>
  header { padding: 28px var(--pad-x-mobile); }
  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--pad-x-mobile); }
  h1 { font-family: var(--font-mono); font-size: 20px; letter-spacing: 0.02em; margin-top: 8px; }
  .lede { color: var(--text-secondary); max-width: 640px; margin-top: 10px; }
  .rule { width: var(--rule-yellow-w); height: var(--rule-yellow-h); background: var(--accent); margin: 18px 0; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 32px 0 64px; }
  @media (max-width: var(--bp-mobile)) { main { grid-template-columns: 1fr; } }
  textarea { width: 100%; min-height: 420px; font-family: var(--font-mono); font-size: 12px; border: var(--hairline); background: #fff; padding: 12px; resize: vertical; }
  button { font-family: var(--font-mono); font-size: 13px; background: var(--text); color: var(--bg); border: none; padding: 10px 18px; cursor: pointer; margin: 12px 0 24px; }
  button:hover { background: #e6bf00; }
  .err { color: var(--bad); font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: var(--hairline); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; background: var(--hover); }
  .band { font-family: var(--font-mono); font-size: 11px; }
  .band.absent, .band.ad_hoc { background: var(--flag-tint); padding: 2px 6px; color: var(--warn); border-color: var(--warn);}
  .gap { border: var(--hairline); padding: 10px 14px; margin: 10px 0; background: #fff; font-size: 13px; }
  .gap code { font-family: var(--font-mono); font-size: 11px; }
  .sec { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 24px 0 8px; }
  .muted { color: var(--text-secondary); font-size: 13px; }
</style>
</head>
<body>
<header><div class="wrap">
  <span class="t-eyebrow">Open legal artifacts · partner-built counterpart</span>
  <h1>ai-governance-benchmark</h1>
  <div class="rule"></div>
  <p class="lede">Score an AI-governance assessment against an open, versioned rubric. Deterministic, evidence-first, framework-grounded. Fictional data below.</p>
</div></header>

<div class="wrap"><main>
  <section>
    <div class="sec">Assessment JSON (editable)</div>
    <textarea id="input" spellcheck="false"></textarea>
    <button id="run">Run benchmark →</button>
    <div id="err" class="err"></div>
  </section>
  <section id="out" aria-live="polite"></section>
</main></div>

<script type="module">
import { scoreAssessment, exportReportMd } from '../core/core.js';

const SAMPLE = {
  org: { name: "Northlake Logistics (fictional)", sector: "freight brokerage", assessment_date: "2026-10-12" },
  answers: [
    { questionId: "inv-1", level: 2, evidence: "Spreadsheet of AI tools started in Q1 2026; 9 tools listed." },
    { questionId: "inv-2", level: 1, evidence: "Owners noted for 4 of 9 tools; rest unmapped." },
    { questionId: "inv-3", level: 0, evidence: "No data-flow documentation exists for any tool." },
    { questionId: "risk-1", level: 1, evidence: "Informal security review for the pricing model only." },
    { questionId: "risk-2", level: 0, evidence: "No re-assessment after the March launch." },
    { questionId: "risk-3", level: 0, evidence: "AI screening of driver applicants in pilot — no heightened review." },
    { questionId: "ven-1", level: 2, evidence: "Standard SaaS security questionnaire covers 3 of 6 AI vendors." },
    { questionId: "ven-2", level: 1, evidence: "One DPA mentions no-training-on-our-data; others silent." },
    { questionId: "ir-1", level: 0, evidence: "No AI-specific incident path; general IT helpdesk only." },
    { questionId: "ir-2", level: 0, evidence: "No severity levels defined for AI issues." },
    { questionId: "ir-3", level: 1, evidence: "Post-outage fixes made but nothing written down." },
    { questionId: "trn-1", level: 1, evidence: "One all-hands slide deck from 2025; no role-based content." },
    { questionId: "trn-2", level: 2, evidence: "Legal inbox published in handbook; usage unclear." }
  ]
};

const $ = (id) => document.getElementById(id);
$('input').value = JSON.stringify(SAMPLE, null, 2);

function esc(s) { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

function render(r) {
  let h = `<div class="sec">Overall — ${esc(r.org?.name ?? '')}</div>
    <p style="font-size:26px;letter-spacing:-0.01em">${r.overall.score.toFixed(2)} <span class="muted">/ 3.00</span>
    · <span class="band ${r.overall.maturity.id}">${esc(r.overall.maturity.label)}</span></p>`;
  if (r.warnings.length) h += `<p class="muted">⚠ ${esc(r.warnings.join(' '))}</p>`;
  h += `<div class="sec">Pillar maturity</div><table><tr><th>Pillar</th><th>Wt</th><th>Score</th><th>Maturity</th></tr>`;
  for (const p of r.pillars) h += `<tr><td>${esc(p.name)}</td><td>${(p.weight*100).toFixed(0)}%</td><td>${p.score.toFixed(2)}</td><td><span class="band ${p.maturity.id}">${esc(p.maturity.label)}</span></td></tr>`;
  h += `</table><div class="sec">Gaps (${r.gaps.length})</div>`;
  for (const g of r.gaps) h += `<div class="gap"><code>${esc(g.questionId)}</code> · ${esc(g.text)}<br>
    <span class="muted">${esc(g.frameworkRefs.join('; '))}</span><br><span class="muted">→ ${esc(g.remediation)}</span></div>`;
  h += `<div class="sec">Report export</div><textarea readonly style="min-height:160px">${esc(exportReportMd(r))}</textarea>`;
  $('out').innerHTML = h;
}

$('run').addEventListener('click', () => {
  $('err').textContent = '';
  try { render(scoreAssessment(JSON.parse($('input').value), { gapThreshold: 1 })); }
  catch (e) { $('err').textContent = String(e.message ?? e); }
});
render(scoreAssessment(SAMPLE, { gapThreshold: 1 }));
</script>
</body>
</html>
