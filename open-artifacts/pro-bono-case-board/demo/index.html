<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pro bono case board — open artifact</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 64px var(--pad-x-mobile) 96px; }
  h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px; }
  .rule { width: var(--rule-yellow-w); height: var(--rule-yellow-h); background: var(--accent); margin: 0 0 20px; }
  .lede { color: var(--text-secondary); max-width: 64ch; line-height: 1.6; margin: 0 0 8px; }
  h2 { font-family: var(--font-mono); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; margin: 40px 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--border); border: var(--hairline); margin-bottom: 24px; }
  .card { background: #fff; padding: 16px; }
  .card .k { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); }
  .card .v { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
  .card.alert .v { background: linear-gradient(transparent 60%, var(--accent) 60%); display: inline; }
  textarea { width: 100%; box-sizing: border-box; min-height: 240px; font-family: var(--font-mono); font-size: 12px; border: var(--hairline); background: #fff; padding: 12px; }
  button { font-family: var(--font-mono); font-size: 13px; border: 1px solid var(--text); background: var(--text); color: var(--bg); padding: 10px 18px; cursor: pointer; margin-top: 12px; }
  button:hover { background: var(--accent); border-color: var(--accent); color: var(--text); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; text-align: left; border-bottom: 2px solid var(--text); padding: 8px 10px; }
  td { border-bottom: var(--hairline); padding: 8px 10px; vertical-align: top; }
  tr:hover td { background: var(--hover); }
  .chip { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--text); padding: 1px 7px; display: inline-block; white-space: nowrap; }
  .chip.stale { background: var(--accent); }
  .flags { color: var(--text-secondary); font-size: 12px; }
  .match { font-family: var(--font-mono); font-size: 11px; }
  .match .inel { color: var(--text-secondary); text-decoration: line-through; }
  .err { border: 2px solid var(--text); background: var(--accent); font-family: var(--font-mono); padding: 12px; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pro bono case board</h1>
  <div class="rule"></div>
  <p class="lede">Intake → placement → closure workflow with guarded transitions, deterministic volunteer-skill matching (tag match with score), stale-case flags, and impact rollups. No LLM — the board is a pure function of the input.</p>

  <h2>Board input (JSON)</h2>
  <textarea id="input" spellcheck="false"></textarea>
  <button id="run">Rebuild board</button>
  <div class="err" id="err"></div>

  <h2>Impact rollup</h2>
  <div id="impact"></div>

  <h2>Cases</h2>
  <div id="board"></div>
</div>

<script type="module">
import { buildBoard, toCSV } from '../core/core.js';

const DEFAULT_INPUT = {
  asOf: new Date().toISOString().slice(0, 10),
  settings: { staleDays: 30, matchLimit: 3 },
  volunteers: [
    { id: 'V-01', name: 'D. Whitfield (fictional)', skills: ['housing', 'tenant-defense', 'spanish'] },
    { id: 'V-03', name: 'K. Osei (fictional)', skills: ['family', 'spanish'] },
    { id: 'V-04', name: 'R. Aronov (fictional)', skills: ['housing', 'tenant-defense', 'benefits', 'spanish'] },
  ],
  cases: [
    { id: 'PB-2026-010', client: 'C. Moreau (fictional)', problem: 'eviction defense', state: 'active', openedDate: '2026-10-20', lastActivityDate: '2026-10-28', requiredSkills: ['housing', 'tenant-defense'], optionalSkills: ['spanish'], volunteerId: 'V-01', hours: 8 },
    { id: 'PB-2026-011', client: 'J. Baptiste (fictional)', problem: 'custody modification', state: 'ready', openedDate: '2026-11-02', lastActivityDate: '2026-11-03', requiredSkills: ['family'], optionalSkills: ['spanish'] },
    { id: 'PB-2026-012', client: 'S. Nakamura (fictional)', problem: 'benefits denial appeal', state: 'triage', openedDate: '2026-08-14', lastActivityDate: '2026-09-20', requiredSkills: ['benefits'], optionalSkills: ['consumer'] },
    { id: 'PB-2025-044', client: 'P. Vargas (fictional)', problem: 'eviction defense', state: 'closed', openedDate: '2025-09-10', lastActivityDate: '2026-03-12', requiredSkills: ['housing'], volunteerId: 'V-04', hours: 41, outcome: 'favorable-settlement' },
  ],
};

const $ = (id) => document.getElementById(id);
$('input').value = JSON.stringify(DEFAULT_INPUT, null, 2);

function esc(s) { return String(s).replace(/</g, '&lt;'); }

$('run').addEventListener('click', () => {
  const errEl = $('err'); errEl.style.display = 'none';
  let b;
  try { b = buildBoard(JSON.parse($('input').value)); }
  catch (e) { errEl.textContent = 'Input error: ' + e.message; errEl.style.display = 'block'; return; }
  const i = b.impact;
  $('impact').innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">Open</div><div class="v">${i.openCases}</div></div>
      <div class="card"><div class="k">Closed</div><div class="v">${i.closedCases}</div></div>
      <div class="card alert"><div class="k">Stale</div><div class="v">${i.staleCases}</div></div>
      <div class="card"><div class="k">Hours</div><div class="v">${i.totalHours}</div></div>
      <div class="card"><div class="k">Flagged</div><div class="v">${i.flaggedCases}</div></div>
    </div>
    <p class="lede" style="font-size:0.8rem">Outcomes: ${Object.entries(i.byOutcome).map(([k, v]) => `${esc(k)} × ${v}`).join(' · ') || '—'}</p>`;
  const order = { active: 0, closing: 1, placed: 2, ready: 3, triage: 4, intake: 5, closed: 6, withdrawn: 7 };
  const rows = [...b.cases].sort((a, c) => (order[a.state] ?? 99) - (order[c.state] ?? 99) || (c.staleFor ?? -1) - (a.staleFor ?? -1))
    .map((r) => `
    <tr>
      <td><strong>${esc(r.id)}</strong> · ${esc(r.client)}<br /><span class="flags">${esc(r.problem)} · opened ${r.openedDate}</span></td>
      <td><span class="chip">${r.state}</span></td>
      <td>${r.volunteerId ?? '—'}</td>
      <td>${r.lastActivityDate ?? '—'} ${r.stale ? '<span class="chip stale">STALE ' + r.staleFor + 'd</span>' : ''}</td>
      <td>${r.matches.length ? r.matches.map((m) => `<span class="match${m.eligible ? '' : ' inel'}">${esc(m.volunteerId)} ${m.score}</span>`).join('<br>') : '—'}</td>
      <td>${r.flags.length ? `<span class="flags">${r.flags.map(esc).join('<br>')}</span>` : '—'}</td>
    </tr>`).join('');
  $('board').innerHTML = `<table><thead><tr><th>Case</th><th>State</th><th>Volunteer</th><th>Last activity</th><th>Matches (score)</th><th>Flags</th></tr></thead><tbody>${rows}</tbody></table>`;
  window.__csv = toCSV(b);
});
$('run').click();
</script>
</body>
</html>
