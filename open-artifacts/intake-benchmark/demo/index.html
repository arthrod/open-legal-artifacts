<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intake Flow Benchmark — open artifact</title>
<link rel="stylesheet" href="tokens.css">
<style>
  header { padding: 28px var(--pad-x-mobile); }
  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--pad-x-mobile); }
  h1 { font-family: var(--font-mono); font-size: 20px; letter-spacing: 0.02em; margin-top: 8px; }
  .lede { color: var(--text-secondary); max-width: 640px; margin-top: 10px; }
  .rule { width: var(--rule-yellow-w); height: var(--rule-yellow-h); background: var(--accent); margin: 18px 0; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 32px 0 64px; }
  @media (max-width: 768px) { main { grid-template-columns: 1fr; } }
  textarea { width: 100%; min-height: 460px; font-family: var(--font-mono); font-size: 12px; border: var(--hairline); background: #fff; padding: 12px; resize: vertical; }
  button { font-family: var(--font-mono); font-size: 13px; background: var(--text); color: var(--bg); border: none; padding: 10px 18px; cursor: pointer; margin: 12px 0 24px; }
  button:hover { background: var(--accent); color: var(--text); }
  .err { color: var(--bad); font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 8px; }
  th, td { border: var(--hairline); padding: 8px 10px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; background: var(--hover); }
  tr.composite td { font-weight: 700; background: #fff; }
  tr.composite td:first-child { border-left: var(--hairline); }
  .rank { font-family: var(--font-mono); font-size: 12px; margin: 16px 0 4px; }
  .sec { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 24px 0 4px; }
  .muted { color: var(--text-secondary); font-size: 13px; }
  .csv { width: 100%; min-height: 140px; font-family: var(--font-mono); font-size: 11px; border: var(--hairline); background: #fff; padding: 10px; }
</style>
</head>
<body>
<header><div class="wrap">
  <span class="t-eyebrow">Open legal artifacts · partner-built counterpart</span>
  <h1>intake-benchmark</h1>
  <div class="rule"></div>
  <p class="lede">Benchmark any two intake flows — software vs. human paper process — on one explicit rubric: completeness, redundancy, fallbacks, speed, retention. Fictional data.</p>
</div></header>

<div class="wrap"><main>
  <section>
    <div class="sec">Runs JSON (editable)</div>
    <textarea id="input" spellcheck="false"></textarea>
    <button id="run">Compare flows →</button>
    <div id="err" class="err"></div>
  </section>
  <section id="out" aria-live="polite"></section>
</main></div>

<script type="module">
import { benchmark, exportCsv } from '../core/core.js';

const SAMPLE = {
  scenario: {
    name: "Personal-injury intake (fictional firm: Bertram & Ozawa LLP)",
    required_fields: ["full_name","date_of_birth","contact_email","contact_phone","incident_date","incident_location","incident_description","injuries_claimed","insurance_carrier","prior_counsel"]
  },
  config: { latencyTargetSeconds: 900 },
  flows: [
    { id: "guided-form", name: "Guided web form", kind: "software",
      steps: [
        { id: "wf-1", purpose: "identity & contact", fields: ["full_name","date_of_birth","contact_email","contact_phone"], latency_seconds: 210, fallback: "front-desk phone intake during business hours" },
        { id: "wf-2", purpose: "incident narrative", fields: ["incident_date","incident_location","incident_description"], latency_seconds: 300, fallback: "free-text box with lawyer review" },
        { id: "wf-3", purpose: "claims screening", fields: ["injuries_claimed","insurance_carrier","prior_counsel"], latency_seconds: 240, fallback: null }
      ], abandonment_rate: 0.18 },
    { id: "paper-intake", name: "Human paper intake", kind: "human",
      steps: [
        { id: "pp-1", purpose: "phone screening", fields: ["full_name","contact_phone","incident_date","incident_description"], latency_seconds: 1200, fallback: "callback next business day; voicemail script" },
        { id: "pp-2", purpose: "mail-out questionnaire", fields: ["date_of_birth","contact_email","incident_location","injuries_claimed","insurance_carrier","prior_counsel","full_name"], latency_seconds: 86400, fallback: "second mailing after 14 days" },
        { id: "pp-3", purpose: "paralegal data entry", fields: ["full_name","incident_date","insurance_carrier"], latency_seconds: 1500, fallback: null }
      ], abandonment_rate: null }
  ]
};

const $ = (id) => document.getElementById(id);
$('input').value = JSON.stringify(SAMPLE, null, 2);
function esc(s) { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
const fmt = (v) => v == null ? '—' : String(v);

function render(r) {
  let h = `<div class="sec">${esc(r.scenario)}</div>`;
  for (const f of r.flows) h += `<p class="rank">#${f.rank} · ${esc(f.name)} (${esc(f.kind)}) — composite <strong>${f.composite}</strong></p>`;
  h += `<table><tr><th>Dimension</th>${r.flows.map((f) => `<th>${esc(f.name)}</th>`).join('')}</tr>`;
  for (const dim of r.dimensionOrder) {
    const cls = dim === 'composite' ? ' class="composite"' : '';
    h += `<tr${cls}><td>${dim}</td>${r.flows.map((f) => `<td>${fmt(dim === 'composite' ? f.composite : f.dimensions[dim])}</td>`).join('')}</tr>`;
  }
  h += `</table><div class="sec">Missing canon fields</div>`;
  for (const f of r.flows) h += `<p class="muted">${esc(f.name)}: ${f.metrics.missing_fields.length ? esc(f.metrics.missing_fields.join(', ')) : 'none'}</p>`;
  if (r.warnings.length) h += `<div class="sec">Warnings</div>` + r.warnings.map((w) => `<p class="muted">⚠ ${esc(w)}</p>`).join('');
  h += `<div class="sec">CSV export</div><textarea class="csv" readonly>${esc(exportCsv(r))}</textarea>`;
  $('out').innerHTML = h;
}
$('run').addEventListener('click', () => {
  $('err').textContent = '';
  try { render(benchmark(JSON.parse($('input').value))); } catch (e) { $('err').textContent = String(e.message ?? e); }
});
render(benchmark(SAMPLE));
</script>
</body>
</html>
