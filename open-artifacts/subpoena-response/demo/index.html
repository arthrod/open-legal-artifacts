<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subpoena Response Tracker — open artifact</title>
<link rel="stylesheet" href="tokens.css">
<style>
  header { padding: 28px var(--pad-x-mobile); }
  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--pad-x-mobile); }
  h1 { font-family: var(--font-mono); font-size: 20px; letter-spacing: 0.02em; margin-top: 8px; }
  .lede { color: var(--text-secondary); max-width: 640px; margin-top: 10px; }
  .rule { width: var(--rule-yellow-w); height: var(--rule-yellow-h); background: var(--accent); margin: 18px 0; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 32px 0 64px; }
  @media (max-width: 768px) { main { grid-template-columns: 1fr; } }
  textarea { width: 100%; min-height: 480px; font-family: var(--font-mono); font-size: 12px; border: var(--hairline); background: #fff; padding: 12px; resize: vertical; }
  button { font-family: var(--font-mono); font-size: 13px; background: var(--text); color: var(--bg); border: none; padding: 10px 18px; cursor: pointer; margin: 12px 0 24px; }
  button:hover { background: var(--accent); color: var(--text); }
  .err { color: var(--bad); font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; }
  .deadline { font-size: 26px; letter-spacing: -0.01em; margin: 6px 0; }
  .status { font-family: var(--font-mono); font-size: 11px; padding: 2px 6px; }
  .status.on_track { background: var(--flag-tint); }
  .status.critical, .status.overdue { border: 1px solid var(--bad); color: var(--bad); background: transparent; }
  .sec { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 24px 0 6px; }
  .bar { height: 8px; background: var(--border); margin: 6px 0; }
  .bar > div { height: 100%; background: var(--flag-tint); }
  ul { list-style: none; }
  ul li { border-top: var(--hairline); padding: 6px 0; font-size: 14px; }
  code { font-family: var(--font-mono); font-size: 11px; }
  .muted { color: var(--text-secondary); font-size: 13px; }
  .warn { border: var(--hairline); padding: 6px 10px; margin: 6px 0; font-size: 13px; }
</style>
</head>
<body>
<header><div class="wrap">
  <span class="t-eyebrow">Open legal artifacts · partner-built counterpart</span>
  <h1>subpoena-response</h1>
  <div class="rule"></div>
  <p class="lede">Deadline math (14-day FRCP-style default, configurable), structured responsive scope, privilege-log workflow, objection-grounds library, checklist export. Fictional matter.</p>
</div></header>

<div class="wrap"><main>
  <section>
    <div class="sec">Subpoena facts JSON (editable)</div>
    <textarea id="input" spellcheck="false"></textarea>
    <button id="run">Track response →</button>
    <div id="err" class="err"></div>
  </section>
  <section id="out" aria-live="polite"></section>
</main></div>

<script type="module">
import { trackResponse, exportChecklistMd } from '../core/core.js';

const SAMPLE = {
  matter: { name: "Drummond v. Halvorsen Freight Co. (fictional)", role: "non-party responding" },
  today: "2026-11-13",
  subpoena: { served_date: "2026-11-02", service_method: "mail", caption: "No. CV-2026-01142 (fictional)" },
  deadline_rule: { days: 14, day_type: "calendar", mail_extension_days: 3 },
  responsive_scope: {
    date_range: { start: "2016-01-01", end: "2026-11-01" },
    custodians: [
      { name: "R. Okonkwo", role: "VP Operations" }, { name: "T. Marsh", role: "Dispatcher" },
      { name: "S. Feld", role: "Safety coordinator" }, { name: "J. Alvarado-Ruiz", role: "Maintenance lead" },
      { name: "M. Pretorius", role: "Night supervisor" }, { name: "D. Whitcombe", role: "HR partner" },
      { name: "K. Nakamura", role: "AP clerk" }, { name: "B. Vess", role: "Sales manager" },
      { name: "P. Ionescu", role: "IT admin" }, { name: "E. Brandt", role: "Former dispatcher" }
    ],
    data_types: [
      { type: "email", systems: ["Exchange Online"] },
      { type: "telemetry logs", systems: ["FleetTrack SaaS"], notes: "~2.1M rows/yr" },
      { type: "personal text messages", systems: ["carrier records"], notes: "Third-party carrier subpoenas needed." },
      { type: "maintenance records", systems: ["ShopFloor DB", "paper"] }
    ]
  },
  privilege_review: { state: "reviewing", reviewer: "A. Castellanos, assoc." },
  objections_selected: ["overbroad_time", "overbroad_custodians", "undue_burden", "pii_privacy", "equally_available"],
  legal_hold: true
};

const $ = (id) => document.getElementById(id);
$('input').value = JSON.stringify(SAMPLE, null, 2);
function esc(s) { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

function render(r) {
  let h = `<div class="sec">Deadline</div>
    <p class="deadline">${esc(r.deadline.deadline)}</p>
    <p class="muted">${r.deadline.total_days} ${r.deadline.day_type} day(s) from service ${esc(r.deadline.served_date)} by ${esc(r.deadline.service_method)} (+${r.deadline.extension_days} ext.)
    · <span class="status ${r.deadline_math.status}">${r.deadline_math.status}</span>
    ${r.deadline_math.days_remaining != null ? ` · ${r.deadline_math.days_remaining} day(s) left` : ''}</p>`;
  h += `<div class="sec">Privilege / log workflow — ${esc(r.privilege.state)}</div>
    <div class="bar"><div style="width:${r.privilege.progress}%"></div></div>
    <p class="muted">${r.privilege.progress}% · legal hold: ${r.legal_hold ? 'issued' : 'NOT issued'}</p>`;
  h += `<div class="sec">Responsive scope</div>
    <ul><li><code>range</code> ${esc(r.scope.date_range.start)} → ${esc(r.scope.date_range.end)} (${r.scope.date_range.span_years} yrs)</li>
    <li><code>custodians</code> ${r.scope.custodian_count}</li>
    ${r.scope.data_types.map((d) => `<li><code>data</code> ${esc(d.type)}${d.systems.length ? ' — ' + esc(d.systems.join('; ')) : ''}</li>`).join('')}</ul>`;
  h += `<div class="sec">Objection grounds (${r.objections.length})</div><ul>`;
  for (const o of r.objections) h += `<li><strong>${esc(o.label)}</strong> — <span class="muted">${esc(o.description)}</span></li>`;
  h += `</ul>`;
  if (r.warnings.length) { h += `<div class="sec">Warnings</div>`; for (const w of r.warnings) h += `<div class="warn">⚠ ${esc(w)}</div>`; }
  h += `<div class="sec">Checklist export</div><textarea readonly style="min-height:180px">${esc(exportChecklistMd(r))}</textarea>`;
  $('out').innerHTML = h;
}
$('run').addEventListener('click', () => {
  $('err').textContent = '';
  try { render(trackResponse(JSON.parse($('input').value))); } catch (e) { $('err').textContent = String(e.message ?? e); }
});
render(trackResponse(SAMPLE));
</script>
</body>
</html>
