<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Intake queue — open artifact</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 64px var(--pad-x-mobile) 96px; }
  h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px; }
  .rule { width: var(--rule-yellow-w); height: var(--rule-yellow-h); background: var(--accent); margin: 0 0 20px; }
  .lede { color: var(--text-secondary); max-width: 64ch; line-height: 1.6; margin: 0 0 8px; }
  h2 { font-family: var(--font-mono); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; margin: 40px 0 12px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 240px; font-family: var(--font-mono); font-size: 12px; border: var(--hairline); background: #fff; padding: 12px; }
  button { font-family: var(--font-mono); font-size: 13px; border: 1px solid var(--text); background: var(--text); color: var(--bg); padding: 10px 18px; cursor: pointer; margin-top: 12px; }
  button:hover { background: var(--accent); border-color: var(--accent); color: var(--text); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--border); border: var(--hairline); margin-bottom: 24px; }
  .card { background: #fff; padding: 16px; }
  .card .k { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); }
  .card .v { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
  .card.alert .v { background: linear-gradient(transparent 60%, var(--accent) 60%); display: inline; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; text-align: left; border-bottom: 2px solid var(--text); padding: 8px 10px; }
  td { border-bottom: var(--hairline); padding: 8px 10px; vertical-align: top; }
  tr:hover td { background: var(--hover); }
  .chip { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--text); padding: 1px 7px; display: inline-block; white-space: nowrap; }
  .chip.urgent, .chip.overdue, .chip.duplicate { background: var(--flag-tint); color: var(--bad); border-color: var(--bad);}
  .notes { color: var(--text-secondary); font-size: 12px; }
  .err { border: 2px solid var(--text); background: var(--flag-tint); font-family: var(--font-mono); padding: 12px; margin-top: 12px; display: none; color: var(--bad); border-color: var(--bad);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Intake queue</h1>
  <div class="rule"></div>
  <p class="lede">New-matter intake queue with deterministic same-party dedupe, conflict-check party matching against a roster, deadline/age urgency triage, and guarded assign states. All matching is visible name math — no black box.</p>

  <h2>Queue input (JSON)</h2>
  <textarea id="input" spellcheck="false"></textarea>
  <button id="run">Process queue</button>
  <div class="err" id="err"></div>

  <h2>Summary</h2>
  <div id="summary"></div>
  <h2>Queue</h2>
  <div id="board"></div>
</div>

<script type="module">
import { processQueue } from '../core/core.js';

const DEFAULT_INPUT = {
  asOf: new Date().toISOString().slice(0, 10),
  roster: [
    { name: 'Northwind Logistics, Inc.', role: 'client', matter: 'LIT-2026-014' },
    { name: 'Brightpath Solar LLC', role: 'adverse', matter: 'LIT-2025-003' },
  ],
  submissions: [
    { id: 'INT-1041', submittedAt: '2026-11-06', client: { name: 'Ridgeline Dental Group PC' }, opposing: { name: 'Sable Insurance Company' }, matterType: 'insurance coverage dispute', deadline: '2026-11-13' },
    { id: 'INT-1042', submittedAt: '2026-11-06', client: { name: 'M. Iwata (fictional)' }, opposing: { name: 'Brightpath Solar' }, matterType: 'property damage', deadline: '2026-12-20' },
    { id: 'INT-1044', submittedAt: '2026-11-07', client: { name: 'Harbor Bakehouse Co.' }, opposing: { name: 'Delgado Trucking LLC' }, matterType: 'contract dispute', deadline: '2027-02-01' },
    { id: 'INT-1047', submittedAt: '2026-11-07', client: { name: 'Harbor Bakehouse Company' }, opposing: { name: 'Delgado Trucking, L.L.C.' }, matterType: 'contract dispute' },
    { id: 'INT-1045', submittedAt: '2026-11-07', client: { name: 'Tilly Andersen (fictional)' }, opposing: { name: 'Coastal View Apartments' }, matterType: 'security deposit return', occurredOn: '2024-05-30' },
  ],
};

const $ = (id) => document.getElementById(id);
$('input').value = JSON.stringify(DEFAULT_INPUT, null, 2);
function esc(s) { return String(s).replace(/</g, '&lt;'); }

$('run').addEventListener('click', () => {
  const errEl = $('err'); errEl.style.display = 'none';
  let q;
  try { q = processQueue(JSON.parse($('input').value)); }
  catch (e) { errEl.textContent = 'Input error: ' + e.message; errEl.style.display = 'block'; return; }
  const s = q.summary;
  $('summary').innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">Submissions</div><div class="v">${s.total}</div></div>
      <div class="card alert"><div class="k">Urgent</div><div class="v">${s.urgent}</div></div>
      <div class="card"><div class="k">Conflicts</div><div class="v">${s.conflicts}</div></div>
      <div class="card"><div class="k">Duplicates</div><div class="v">${s.duplicates}</div></div>
    </div>`;
  const stateRank = { urgent: 0, 'conflict-review': 1, assignable: 2, duplicate: 3, assigned: 4, new: 5 };
  const rows = [...q.items].sort((a, b) => stateRank[a.state] - stateRank[b.state] || a.id.localeCompare(b.id))
    .map((i) => `
    <tr>
      <td><strong>${esc(i.id)}</strong><br /><span class="notes">${i.submittedAt}</span></td>
      <td>${esc(i.client)}<br />↕<br />${esc(i.opposing)}</td>
      <td>${esc(i.matterType)}<br /><span class="notes">deadline: ${i.deadline ?? '—'}</span></td>
      <td><span class="chip ${i.urgency.level}">${i.urgency.level}</span></td>
      <td><span class="chip ${i.state}">${i.state}</span>${i.duplicateOf ? `<br /><span class="notes">dup of ${esc(i.duplicateOf)}</span>` : ''}</td>
      <td>${i.conflicts.length ? i.conflicts.map((c) => `<span class="notes"><strong>${esc(c.rosterName)}</strong> (${c.role} on ${esc(c.matter ?? 'roster')}) ↔ ${c.matchedSide} @ ${c.score}</span>`).join('<br>') : '—'}</td>
      <td>${i.flags.length ? `<span class="notes">${i.flags.map(esc).join('<br>')}</span>` : '—'}</td>
    </tr>`).join('');
  $('board').innerHTML = `<table><thead><tr><th>Id</th><th>Parties</th><th>Matter</th><th>Urgency</th><th>State</th><th>Conflicts</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table>`;
});
$('run').click();
</script>
</body>
</html>
