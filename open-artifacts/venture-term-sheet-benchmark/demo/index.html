<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Term Sheet Benchmark — open artifact</title>
<link rel="stylesheet" href="tokens.css">
<style>
  header { padding: 28px var(--pad-x-mobile); }
  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--pad-x-mobile); }
  h1 { font-family: var(--font-mono); font-size: 20px; letter-spacing: 0.02em; margin-top: 8px; }
  .lede { color: var(--text-secondary); max-width: 640px; margin-top: 10px; }
  .rule { width: var(--rule-yellow-w); height: var(--rule-yellow-h); background: var(--accent); margin: 18px 0; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 32px 0 64px; }
  @media (max-width: 768px) { main { grid-template-columns: 1fr; } }
  textarea { width: 100%; min-height: 440px; font-family: var(--font-mono); font-size: 12px; border: var(--hairline); background: #fff; padding: 12px; resize: vertical; }
  button { font-family: var(--font-mono); font-size: 13px; background: var(--text); color: var(--bg); border: none; padding: 10px 18px; cursor: pointer; margin: 12px 0 24px; }
  button:hover { background: var(--accent); color: var(--text); }
  .err { color: var(--bad); font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: var(--hairline); padding: 7px 9px; text-align: left; vertical-align: top; }
  th { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; background: var(--hover); }
  .v { font-family: var(--font-mono); font-size: 11px; }
  .v.outside_market { background: var(--flag-tint); padding: 2px 5px; }
  .v.no_benchmark, .v.unknown_value_type { background: var(--border); padding: 2px 5px; }
  .src { color: var(--text-secondary); font-size: 11px; }
  .sec { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 24px 0 6px; }
  .muted { color: var(--text-secondary); font-size: 13px; }
  .counts { font-size: 20px; margin: 4px 0; }
</style>
</head>
<body>
<header><div class="wrap">
  <span class="t-eyebrow">Open legal artifacts · partner-built counterpart</span>
  <h1>venture-term-sheet-benchmark</h1>
  <div class="rule"></div>
  <p class="lede">Terms × a dated, sourced, editable market grid. Structural enums cite the NVCA model docs; numeric ranges are labeled example defaults you replace. Nothing guessed.</p>
</div></header>

<div class="wrap"><main>
  <section>
    <div class="sec">Term sheet JSON (editable)</div>
    <textarea id="input" spellcheck="false"></textarea>
    <button id="run">Benchmark terms →</button>
    <div id="err" class="err"></div>
  </section>
  <section id="out" aria-live="polite"></section>
</main></div>

<script type="module">
import { benchmarkTermSheet, exportMd } from '../core/core.js';

const SAMPLE = {
  term_sheet: {
    company: "Quillform Analytics, Inc. (fictional)",
    round: "series_a", vintage: 2026,
    lead_investor: "Fathom Ridge Capital (fictional)",
    terms: {
      liquidation_preference_multiple: 1.5,
      participation: "participating",
      anti_dilution: "full_ratchet",
      seniority: "senior_to_all_prior",
      investor_board_seats: 2,
      dividends: "cumulative",
      redemption: "investor_demand_after_5y",
      pro_rata_rights: "granted_major_investors",
      pay_to_play: "none",
      founder_vesting_restart: true
    }
  }
};

const $ = (id) => document.getElementById(id);
$('input').value = JSON.stringify(SAMPLE, null, 2);
function esc(s) { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

function render(r) {
  let h = `<div class="sec">${esc(r.company || 'Term sheet')} · ${esc(r.round)}${r.vintage ? ' ' + r.vintage : ''} · grid as of ${esc(r.gridAsOf)}</div>
    <p class="counts">${r.counts.inside_market} inside · ${r.counts.outside_market} outside · ${r.counts.no_benchmark} no benchmark</p>`;
  for (const w of r.warnings) h += `<p class="muted">⚠ ${esc(w)}</p>`;
  h += `<table><tr><th>Term</th><th>Value</th><th>Verdict</th><th>Benchmark</th><th>Source</th></tr>`;
  for (const t of r.terms) h += `<tr><td>${esc(t.name)}</td><td>${esc(t.value)}</td>
    <td><span class="v ${t.verdict}">${t.verdict}</span></td><td>${esc(t.benchmark)}</td>
    <td class="src">${t.source ? `${esc(t.source.name)} (${esc(t.source.asOf)})` : '—'}</td></tr>`;
  h += `</table><div class="sec">Report export</div><textarea readonly style="min-height:150px">${esc(exportMd(r))}</textarea>`;
  $('out').innerHTML = h;
}
$('run').addEventListener('click', () => {
  $('err').textContent = '';
  try { render(benchmarkTermSheet(JSON.parse($('input').value))); } catch (e) { $('err').textContent = String(e.message ?? e); }
});
render(benchmarkTermSheet(SAMPLE));
</script>
</body>
</html>
